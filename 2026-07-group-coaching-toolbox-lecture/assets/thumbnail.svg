<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">구자호 코치 그룹코칭 툴박스 저자특강</title>
  <desc id="desc">더마크월드 레고코치님을 위한 신간 도서 10% 할인, 무료 배송, 7월 7일 온라인 특강 안내 썸네일</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#f4f8fc"/>
      <stop offset="1" stop-color="#fff1c8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#102033" flood-opacity="0.26"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="132" cy="114" r="230" fill="#10a8d8" opacity="0.16"/>
  <rect x="64" y="46" width="58" height="58" rx="8" fill="#102033"/>
  <text x="93" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#f3bf4d">M</text>
  <text x="138" y="84" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#102033">더마크월드</text>
  <text x="64" y="176" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#0b4aa2">레고코치님을 위한 온라인 특강</text>
  <text x="64" y="270" font-family="Arial, sans-serif" font-size="76" font-weight="900" fill="#102033">그룹코칭</text>
  <text x="64" y="352" font-family="Arial, sans-serif" font-size="76" font-weight="900" fill="#102033">툴박스 저자특강</text>
  <rect x="64" y="410" width="680" height="58" rx="8" fill="#102033"/>
  <text x="404" y="449" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="900" fill="#ffffff">7.7 화 20:00 · 18,000원 · 무료 배송</text>
  <g filter="url(#shadow)">
    <rect x="826" y="88" width="300" height="398" rx="8" fill="#0b4aa2"/>
    <rect x="844" y="106" width="264" height="362" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <text x="856" y="184" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff">그룹코칭</text>
    <text x="856" y="248" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff">툴박스</text>
    <text x="856" y="330" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#ffe39a">구자호 코치</text>
  </g>
  <text x="826" y="572" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#d7352b">신간 도서 + Zoom 특강</text>
</svg>
