<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>랜딩페이지 썸네일</title>
    <style>
      :root {
        font-family:
          Pretendard,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #102033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #e8eef6;
      }

      .thumbnail {
        position: relative;
        width: min(1200px, 100vw);
        aspect-ratio: 1200 / 630;
        overflow: hidden;
        background:
          linear-gradient(132deg, rgba(16, 168, 216, 0.18), transparent 42%),
          linear-gradient(160deg, #ffffff 0%, #f4f8fc 58%, #fff1c8 100%);
        border: 1px solid #dfe6ef;
      }

      .mark {
        position: absolute;
        top: 46px;
        left: 64px;
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 28px;
        font-weight: 900;
      }

      .logo-box {
        display: grid;
        place-items: center;
        width: 58px;
        height: 58px;
        background: #102033;
        color: #f3bf4d;
        border-radius: 8px;
        font-weight: 900;
      }

      .content {
        position: absolute;
        top: 142px;
        left: 64px;
        width: 690px;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: #0b4aa2;
        font-size: 28px;
        font-weight: 900;
      }

      h1 {
        margin: 0;
        font-size: 76px;
        line-height: 1.08;
        letter-spacing: 0;
      }

      .meta {
        display: inline-flex;
        margin-top: 36px;
        padding: 13px 20px;
        background: #102033;
        border-radius: 8px;
      }

      .meta span {
        color: #ffffff;
        font-size: 22px;
        font-weight: 900;
      }

      .book {
        position: absolute;
        right: 74px;
        top: 88px;
        width: 300px;
        height: 398px;
        padding: 24px;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 28px 58px rgba(16, 32, 51, 0.26);
      }

      .book img {
        display: block;
        width: 100%;
        height: 280px;
        object-fit: contain;
      }

      .book span {
        display: grid;
        place-items: center;
        margin-top: 20px;
        padding: 12px;
        background: #0b4aa2;
        color: #ffffff;
        border-radius: 8px;
        font-size: 24px;
        font-weight: 900;
      }

      .bottom {
        position: absolute;
        right: 74px;
        bottom: 58px;
        color: #d7352b;
        font-size: 32px;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <main class="thumbnail" aria-label="구자호 코치 그룹코칭 툴박스 저자특강 썸네일">
      <div class="mark">
        <div class="logo-box">M</div>
        <span>더마크월드</span>
      </div>
      <section class="content">
        <p class="eyebrow">레고코치님을 위한 온라인 특강</p>
        <h1>그룹코칭 툴박스 저자특강</h1>
        <div class="meta">
          <span>7.7 화 20:00 · 18,000원 · 무료 배송</span>
        </div>
      </section>
      <aside class="book">
        <img src="./assets/book-cover.png" alt="그룹코칭 툴박스 도서 표지" />
        <span>18,000원 무료배송</span>
      </aside>
      <div class="bottom">신간 도서 + Zoom 특강</div>
    </main>
  </body>
</html>
